# Lightweight, line-based highlighting; see docs/syntax-highlighting.md.

[syntax]
name = "SQL"
extensions = ["sql"]

[[syntax.rules]]
name = "comment"
pattern = "--.*$|/\\*.*?(?:\\*/|$)"
color = "#6A9955"

[[syntax.rules]]
name = "string"
pattern = "'(?:[^']|'')*'|\\\"(?:[^\\\"]|\\\"\\\")*\\\"|`[^`]*`"
color = "#CE9178"

[[syntax.rules]]
name = "number"
pattern = "\\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|[0-9][0-9_]*(?:\\.[0-9_]+)?(?:[eE][+-]?[0-9_]+)?)[a-zA-Z0-9_]*\\b"
color = "#B5CEA8"

[[syntax.rules]]
name = "keyword"
pattern = "(?i:\\b(?:select|from|where|insert|into|values|update|set|delete|create|alter|drop|table|index|view|database|schema|join|inner|left|right|full|outer|cross|on|as|and|or|not|in|is|null|like|between|exists|distinct|all|union|intersect|except|group|by|order|having|limit|offset|fetch|top|asc|desc|case|when|then|else|end|with|recursive|over|partition|returning|primary|key|foreign|references|unique|constraint|default|check|begin|commit|rollback|transaction|grant|revoke|if|replace|truncate|cascade)\\b)"
color = "#569CD6"

[[syntax.rules]]
name = "type"
pattern = "(?i:\\b(?:bigint|binary|bit|blob|boolean|char|date|datetime|decimal|double|float|int|integer|interval|json|numeric|real|smallint|text|time|timestamp|uuid|varchar)\\b)"
color = "#4EC9B0"
