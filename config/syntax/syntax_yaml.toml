# Lightweight, line-based highlighting; see docs/syntax-highlighting.md.

[syntax]
name = "YAML"
extensions = ["yaml", "yml"]

[[syntax.rules]]
name = "comment"
pattern = "(?:^|\\s)#.*$"
color = "#6A9955"

[[syntax.rules]]
name = "string"
pattern = "\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'"
color = "#CE9178"

[[syntax.rules]]
name = "directive"
pattern = "^\\s*(?:---|\\.\\.\\.|%[A-Za-z]+)|[&*!][A-Za-z_][A-Za-z0-9_.-]*"
color = "#C586C0"

[[syntax.rules]]
name = "property"
pattern = "(?:^|\\s)[A-Za-z_][A-Za-z0-9_.-]*\\s*:"
color = "#9CDCFE"

[[syntax.rules]]
name = "number"
pattern = "\\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|[0-9][0-9_]*(?:\\.[0-9_]+)?(?:[eE][+-]?[0-9_]+)?)[a-zA-Z0-9_]*\\b"
color = "#B5CEA8"

[[syntax.rules]]
name = "constant"
pattern = "(?i:\\b(?:true|false|null|yes|no|on|off)\\b)|~"
color = "#4FC1FF"
