# Lightweight, line-based highlighting; see docs/syntax-highlighting.md.

[syntax]
name = "TypeScript"
extensions = ["ts", "tsx", "mts", "cts"]

[[syntax.rules]]
name = "comment"
pattern = "//.*$|/\\*.*?(?:\\*/|$)"
color = "#6A9955"

[[syntax.rules]]
name = "string"
pattern = "\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'"
color = "#CE9178"

[[syntax.rules]]
name = "string"
pattern = "`(?:[^`\\\\]|\\\\.)*`"
color = "#CE9178"

[[syntax.rules]]
name = "constant"
pattern = "\\b(?:true|false|null|undefined)\\b"
color = "#4FC1FF"

[[syntax.rules]]
name = "directive"
pattern = "@[A-Za-z_$][\\w$]*"
color = "#C586C0"

[[syntax.rules]]
name = "property"
pattern = "\\b[A-Za-z_$][\\w$]*\\s*:"
color = "#9CDCFE"

[[syntax.rules]]
name = "number"
pattern = "\\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|[0-9][0-9_]*(?:\\.[0-9_]+)?(?:[eE][+-]?[0-9_]+)?)[a-zA-Z0-9_]*\\b"
color = "#B5CEA8"

[[syntax.rules]]
name = "keyword"
pattern = "\\b(?:abstract|as|asserts|async|await|break|case|catch|class|const|constructor|continue|debugger|declare|default|delete|do|else|enum|export|extends|finally|for|from|function|get|if|implements|import|in|infer|instanceof|interface|is|keyof|let|namespace|new|of|override|private|protected|public|readonly|require|return|satisfies|set|static|super|switch|this|throw|try|type|typeof|unique|using|var|void|while|with|yield)\\b"
color = "#569CD6"

[[syntax.rules]]
name = "type"
pattern = "\\b(?:any|bigint|boolean|never|number|object|string|symbol|unknown)\\b"
color = "#4EC9B0"
