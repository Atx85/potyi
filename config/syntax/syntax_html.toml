# Lightweight, line-based highlighting; see docs/syntax-highlighting.md.

[syntax]
name = "HTML"
extensions = ["html", "htm", "xhtml"]

[[syntax.rules]]
name = "comment"
pattern = "<!--.*?(?:-->|$)"
color = "#6A9955"

[[syntax.rules]]
name = "directive"
pattern = "(?i:<!DOCTYPE\\b[^>]*>)"
color = "#C586C0"

[[syntax.rules]]
name = "string"
pattern = "\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'"
color = "#CE9178"

[[syntax.rules]]
name = "keyword"
pattern = "</?[A-Za-z][A-Za-z0-9:-]*|/?>"
color = "#569CD6"

[[syntax.rules]]
name = "property"
pattern = "\\b[A-Za-z_:][A-Za-z0-9_:.-]*\\s*="
color = "#9CDCFE"

[[syntax.rules]]
name = "constant"
pattern = "&(?:[A-Za-z][A-Za-z0-9]*|#[0-9]+|#x[0-9a-fA-F]+);"
color = "#4FC1FF"
