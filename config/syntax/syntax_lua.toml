# Lightweight, line-based highlighting; see docs/syntax-highlighting.md.

[syntax]
name = "Lua / Luau"
extensions = ["lua", "luau"]

[[syntax.rules]]
name = "comment"
pattern = "--\\[\\[.*?(?:\\]\\]|$)|--.*$"
color = "#6A9955"

[[syntax.rules]]
name = "string"
pattern = "\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'"
color = "#CE9178"

[[syntax.rules]]
name = "string"
pattern = "\\[\\[.*?\\]\\]"
color = "#CE9178"

[[syntax.rules]]
name = "constant"
pattern = "\\b(?:true|false|nil)\\b"
color = "#4FC1FF"

[[syntax.rules]]
name = "number"
pattern = "\\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|[0-9][0-9_]*(?:\\.[0-9_]+)?(?:[eE][+-]?[0-9_]+)?)[a-zA-Z0-9_]*\\b"
color = "#B5CEA8"

[[syntax.rules]]
name = "keyword"
pattern = "\\b(?:and|break|continue|do|else|elseif|end|export|for|function|if|in|local|not|or|repeat|return|then|type|typeof|until|while)\\b"
color = "#569CD6"
