# Lightweight, line-based highlighting; see docs/syntax-highlighting.md.

[syntax]
name = "JSON / JSONC"
extensions = ["json", "jsonc"]

[[syntax.rules]]
name = "comment"
pattern = "//.*$|/\\*.*?(?:\\*/|$)"
color = "#6A9955"

[[syntax.rules]]
name = "property"
pattern = "\"(?:[^\"\\\\]|\\\\.)*\"\\s*:"
color = "#9CDCFE"

[[syntax.rules]]
name = "string"
pattern = "\"(?:[^\"\\\\]|\\\\.)*\""
color = "#CE9178"

[[syntax.rules]]
name = "number"
pattern = "\\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|[0-9][0-9_]*(?:\\.[0-9_]+)?(?:[eE][+-]?[0-9_]+)?)[a-zA-Z0-9_]*\\b"
color = "#B5CEA8"

[[syntax.rules]]
name = "constant"
pattern = "\\b(?:true|false|null)\\b"
color = "#4FC1FF"
