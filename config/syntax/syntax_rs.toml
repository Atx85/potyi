# config/syntax/syntax_rust.toml

[syntax]
name = "Rust"
extensions = ["rs"]

[[syntax.rules]]
name = "comment"
pattern = '''//.*$'''
color = "#6A9955"

[[syntax.rules]]
name = "comment"
pattern = '''/\*.*?\*/'''
color = "#6A9955"

[[syntax.rules]]
name = "string"
pattern = '''"([^"\\]|\\.)*"'''
color = "#CE9178"

[[syntax.rules]]
name = "character"
# Require one character or escape and a closing quote; labels/lifetimes stay separate.
pattern = '''b?'(?:[^'\\\r\n\t]|\\(?:['"\\nrt0]|x[0-9a-fA-F]{2}|u\{[0-9a-fA-F_]+\}))''''
color = "#CE9178"

[[syntax.rules]]
name = "number"
pattern = '''\b(0x[0-9a-fA-F]+|0b[01]+|0o[0-7]+|[0-9]+(\.[0-9]+)?)\b'''
color = "#B5CEA8"

[[syntax.rules]]
name = "keyword"
pattern = '''\b(as|async|await|break|const|continue|crate|dyn|else|enum|extern|false|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|Self|static|struct|super|trait|true|type|unsafe|use|where|while|abstract|become|box|do|final|macro|override|priv|typeof|unsized|virtual|yield|try)\b'''
color = "#569CD6"

[[syntax.rules]]
name = "type"
pattern = '''\b(bool|char|str|u8|u16|u32|u64|u128|usize|i8|i16|i32|i64|i128|isize|f32|f64)\b'''
color = "#4EC9B0"

[[syntax.rules]]
name = "attribute"
pattern = '''#!?\[[^\]]+\]'''
color = "#C586C0"

[[syntax.rules]]
name = "macro"
pattern = '''\b[a-zA-Z_][a-zA-Z0-9_]*!'''
color = "#DCDCAA"

[[syntax.rules]]
name = "function"
pattern = '''\bfn\s+[a-zA-Z_][a-zA-Z0-9_]*'''
color = "#DCDCAA"

[[syntax.rules]]
name = "constant"
pattern = '''\b[A-Z][A-Z0-9_]*\b'''
color = "#4FC1FF"

[[syntax.rules]]
name = "lifetime"
pattern = ''''[a-zA-Z_][a-zA-Z0-9_]*'''
color = "#D7BA7D"