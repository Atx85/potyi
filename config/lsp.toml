# LSP is opt-in. Install the server separately, then set enabled = true.
# Servers start on member-access autocomplete or an explicit LSP command.
enabled = false

[[servers]]
name = "rust"
command = "rust-analyzer"
args = []
extensions = ["rs"]
language_id = "rust"
root_markers = ["Cargo.toml", ".git"]

# Optional server-specific options, passed in the initialize request.
[servers.initialization_options]
cachePriming = { enable = false }
checkOnSave = false

# Add more [[servers]] entries for other installed stdio language servers.
# Each entry needs name, command, extensions, and language_id.

# C# and Unity: install csharp-ls separately. Unity project files must be generated.
[[servers]]
name = "csharp"
command = "csharp-ls"
args = []
extensions = ["cs", "csx"]
language_id = "csharp"
root_markers = ["global.json", "Directory.Build.props", ".git"]
