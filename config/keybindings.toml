# config/keybindings.toml

[[bindings]]
key = "N"
modifiers = ["Ctrl"]
command = "NewFile"
repeatable = false

[[bindings]]
key = "N"
modifiers = ["Gui"]
command = "NewFile"
repeatable = false

# ---------------------------------------------------------

# Cursor movement

# ---------------------------------------------------------

[[bindings]]
key = "Left"
modifiers = []
command = "MoveLeft"
repeatable = true

[[bindings]]
key = "Tab"
modifiers = []
command = "InsertTab"
repeatable = false

[[bindings]]
key = "Right"
modifiers = []
command = "MoveRight"
repeatable = true

[[bindings]]
key = "Up"
modifiers = []
command = "MoveUp"
repeatable = true

[[bindings]]
key = "Down"
modifiers = []
command = "MoveDown"
repeatable = true

# ---------------------------------------------------------

# Selection

# ---------------------------------------------------------

[[bindings]]
key = "Left"
modifiers = ["Shift"]
command = "SelectLeft"
repeatable = true

[[bindings]]
key = "Right"
modifiers = ["Shift"]
command = "SelectRight"
repeatable = true

[[bindings]]
key = "Up"
modifiers = ["Shift"]
command = "SelectUp"
repeatable = true

[[bindings]]
key = "Down"
modifiers = ["Shift"]
command = "SelectDown"
repeatable = true

# ---------------------------------------------------------

# Editing

#

# IMPORTANT:

# Printable characters, including Space, are NOT keybindings.

# They arrive through SDL TextInput.

# ---------------------------------------------------------

[[bindings]]
key = "Backspace"
modifiers = []
command = "Backspace"
repeatable = true

[[bindings]]
key = "Delete"
modifiers = []
command = "Delete"
repeatable = true

[[bindings]]
key = "Return"
modifiers = []
command = "Newline"
repeatable = false

[[bindings]]
key = "KpEnter"
modifiers = []
command = "Newline"
repeatable = false

# ---------------------------------------------------------

# Navigation

# ---------------------------------------------------------

[[bindings]]
key = "Home"
modifiers = []
command = "Home"
repeatable = false

[[bindings]]
key = "End"
modifiers = []
command = "End"
repeatable = false

