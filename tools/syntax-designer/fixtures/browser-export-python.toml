# Created with the Pötyi syntax designer.
# Place in config/syntax/ and reopen your document.

[syntax]
name = "Python"
extensions = ["py", "pyw", "pyi"]

[[syntax.rules]]
name = "comment"
pattern = "#.*$"
color = "#e879f9"

[[syntax.rules]]
name = "string"
pattern = "(?i:rb|br|rf|fr|r|u|b|f)?(?:\"\"\".*?\"\"\"|'''.*?'''|\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*')"
color = "#CE9178"

[[syntax.rules]]
name = "directive"
pattern = "@[A-Za-z_][A-Za-z0-9_.]*"
color = "#C586C0"

[[syntax.rules]]
name = "constant"
pattern = "\\b(?:True|False|None)\\b"
color = "#4FC1FF"

[[syntax.rules]]
name = "number"
pattern = "\\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|[0-9][0-9_]*(?:\\.[0-9_]+)?(?:[eE][+-]?[0-9_]+)?)[a-zA-Z0-9_]*\\b"
color = "#B5CEA8"

[[syntax.rules]]
name = "keyword"
pattern = "\\b(?:and|as|assert|async|await|break|case|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|match|nonlocal|not|or|pass|raise|return|try|while|with|yield)\\b"
color = "#569CD6"

[[syntax.rules]]
name = "type"
pattern = "\\b(?:bool|bytearray|bytes|complex|dict|float|frozenset|int|list|memoryview|object|range|set|str|tuple|type)\\b"
color = "#4EC9B0"
